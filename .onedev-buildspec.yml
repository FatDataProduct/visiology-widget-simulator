version: 6
jobs:
- name: Pull from GitHub
  steps:
  - !PullRepository
    name: pull
    remoteUrl: https://github.com/FatDataProduct/visiology-widget-simulator.git
    userName: x-access-token
    passwordSecret: github-access-token
    syncToChildProject: false
    refs: refs/heads/* refs/tags/*
    withLfs: false
    force: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  # Без cron: направление зеркала — OneDev → GitHub (job ниже).
  # Pull остаётся для ручного GH → OneDev на default-ветке.
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Push to GitHub
  steps:
  - !PushRepository
    name: push
    remoteUrl: https://github.com/FatDataProduct/visiology-widget-simulator.git
    userName: x-access-token
    passwordSecret: github-access-token
    force: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: '*'
  - !TagCreateTrigger
    tags: '*'
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
