version: 6
jobs:
- name: Pull from GitHub
  steps:
  - !PullRepository
    name: pull
    remoteUrl: https://github.com/FatDataProduct/visiology-widget-simulator.git
    userName: x-access-token
    passwordSecret: github-access-token
    syncToChildProject: false
    refs: refs/heads/* refs/tags/*
    withLfs: false
    force: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  # Cron снят: OneDev больше не зеркалит GitHub сам.
  # Job остаётся для ручного запуска Pull from GitHub на default-ветке.
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
